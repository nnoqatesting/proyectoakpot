<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nico N3F</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            min-height:100vh;
            background-image: url("./img/fondo-seccion.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color:#fff;
        }

        /* NAVBAR */
        nav{
            width:100%;
            height:80px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 60px;
            background:rgba(0,0,0,.45);
            backdrop-filter: blur(8px);
        }

        .logo{
            height:55px;
            width:auto;
        }

        /* CONTENIDO */
        main{
            min-height:calc(100vh - 80px);
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:40px;
        }

        .contenido{
            max-width:700px;
            background:rgba(0,0,0,.45);
            padding:40px;
            border-radius:16px;
        }

        h1{
            font-size:3rem;
            margin-bottom:20px;
        }

        p{
            font-size:1.1rem;
            line-height:1.6;
            margin-bottom:35px;
        }

        .btn{
            display:inline-block;
            padding:14px 34px;
            background:#ffffff;
            color:#111;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
            transition:.3s;
        }

        .btn:hover{
            transform:translateY(-3px);
            background:#ececec;
        }

        @media(max-width:768px){

            nav{
                padding:0 20px;
                height:70px;
            }

            .logo{
                height:45px;
            }

            h1{
                font-size:2.2rem;
            }

            .contenido{
                padding:30px 25px;
            }

        }
    </style>
</head>
<body>

    <nav>
        <img src="./img/akpot.logo.jpg" alt="AKPOT Logo" class="logo">
    </nav>

    <main>
        <div class="contenido">
            <h1>Prueba</h1>

            <p>
                Este es un contenido de prueba para que otro programador pueda
                comenzar a desarrollar esta sección.
            </p>

            <a href="./index.html" class="btn">← Volver</a>
        </div>
    </main>

</body>
</html>
